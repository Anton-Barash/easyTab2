name: Deploy Frontend

# Деплой Flutter Web напрямую на сервер через SCP (как бэкенд).
#
# Схема: CI собирает бандл → SCP build/web в ~/easy_tab_Server/web/ →
# pm2 reload на сервере.
#
# НЕ коммитим build/web в бэкенд-репозиторий: сервер больше не делает
# git pull (он не достукивается до GitHub из-за сети). Единственный канал
# доставки — SCP из GitHub Actions.
#
# Требуемые секреты: SERVER_HOST, SERVER_USER, SSH_KEY
# (те же, что используются в бэкенд-workflow easy-tab-Server).
on:
  push:
    branches: [ master ]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: # ручной запуск из вкладки Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Ранний fail с понятным сообщением, если секреты не настроены.
      - name: Verify required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::Секрет SERVER_HOST не настроен в этом репозитории."
            echo "::error::Добавьте SERVER_HOST, SERVER_USER и SSH_KEY:"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Версия Flutter зафиксирована = локальной (3.41.9).
      # Это критично: canvaskit на сервере должен совпадать с движком,
      # которым собран main.dart.js.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Анализ: info-сообщения не блокируют деплой (только error/warning).
      # По аналогии с корневым .github/workflows/ci.yml.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # --no-wasm-dry-run: dart2js (Canvaskit) вместо Wasm —
      # deferred loading не поддерживается в Wasm,
      # а пакет win32 (dart:ffi) несовместим с Wasm-компиляцией.
      - name: Build web
        run: flutter build web --release --no-wasm-dry-run

      - name: Deploy frontend to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          source: "build/web/*"
          target: "~/easy_tab_Server/web/"
          # Срезаем 'build/web' (2 компонента), чтобы файлы сборки легли
          # прямо в ~/easy_tab_Server/web/, а не в web/web/.
          strip_components: 2
          overwrite: true

      - name: Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          script: |
            cd ~/easy_tab_Server
            pm2 startOrReload ecosystem.config.js --env production --update-env
            echo "Web deployment completed successfully"
