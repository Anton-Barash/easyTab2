org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=JKS
android.useAndroidX=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.19.10-hotspot

# Disable Kotlin incremental compilation (fixes cross-drive issue)
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# Увеличенные сетевые таймауты для скачивания зависимостей с зеркал (Aliyun/Tencent).
# Иначе на медленном соединении Gradle падает с "Read timed out".
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.connectionRequestTimeout=300000

# Прокси отключен — китайские зеркала доступны напрямую.
# Если нужно включить прокси снова, раскомментируйте строки ниже и укажите правильный порт:
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=12334
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=12334
