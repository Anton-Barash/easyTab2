<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="easy_tab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>easy_tab</title>
  <link rel="manifest" href="manifest.json">

  <!-- Custom CSS for flt-semantics-host -->
  <style>
    flutter-view > flt-semantics-host {
      color: rgb(0, 0, 55) !important;
    }

    /* Splash-экран: показывается мгновенно (inline CSS, без запросов),
       пока грузится main.dart.js. Удаляется событием flutter-first-frame. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
    #splash .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #4a6fa5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    #splash .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #d0d7e2;
      border-top-color: #4a6fa5;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Splash: виден сразу, до загрузки JS-бандла (важно при медленном канале) -->
  <div id="splash">
    <div class="splash-logo">ET</div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    // Flutter диспатчит flutter-first-frame при первом отрисованном кадре —
    // в этот момент splash больше не нужен.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) el.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- FFmpeg.wasm loader для сжатия видео (ffmpeg.js грузится лениво при первом сжатии) -->
  <script src="ffmpeg-loader.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
