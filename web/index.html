<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="easy_tab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>easy_tab</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload: браузер начинает загрузку главных ресурсов сразу при
       парсинге HTML, не дожидаясь исполнения flutter_bootstrap.js
       (~200-400 ms выигрыша). crossorigin обязателен для fetch-загрузки
       canvaskit.wasm (иначе preload не совпадёт с реальным запросом).
       canvaskit.js намеренно НЕ preload'им: движок грузит его своим
       способом, preload не дедуплицируется — файл качался ДВАЖДЫ
       (замерено в DevTools 21.08: 29.5 KB × 2, лишние ~2 с на 1 Mbps). -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>

  <!-- Custom CSS for flt-semantics-host -->
  <style>
    flutter-view > flt-semantics-host {
      color: rgb(0, 0, 55) !important;
    }

    /* Splash-экран: показывается мгновенно (inline CSS, без запросов),
       пока грузится main.dart.js. Удаляется событием flutter-first-frame. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f7f2;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
    /* Звёздное небо: канвас на весь сплэш, логотип и спиннер поверх */
    #splash #stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #splash .splash-logo,
    #splash .splash-progress {
      position: relative;
      z-index: 1;
    }
    /* Логотип-вордмарк в палитре приложения (AppColors):
       primary #2563eb → primaryLight #3B82F6, textDark #111827. */
    #splash .splash-logo {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
      margin-bottom: 20px;
    }
    #splash .splash-logo .logo-accent {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border-radius: 12px;
      padding: 2px 10px;
      margin-left: 2px;
    }
    /* Полоса загрузки: indeterminate, в стиле Material LinearProgressIndicator.
       Цвета primary #2563eb → primaryLight #3B82F6 из AppColors. */
    #splash .splash-progress {
      width: 200px;
      height: 4px;
      border-radius: 2px;
      background: rgba(37, 99, 235, 0.15);
      overflow: hidden;
    }
    #splash .splash-progress::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      border-radius: 2px;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      animation: splash-slide 1.4s ease-in-out infinite;
    }
    @keyframes splash-slide {
      0%   { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <script>
    // Облегчённый просмотр отчёта: /#/view-report2?pid=...&token=...
    // Вместо загрузки Flutter (main.dart.js + canvaskit.wasm) сразу уходим на
    // серверную страницу отчёта /view/report/:pid — сервер отдаёт готовый
    // HTML, страница открывается в разы быстрее. Обычное приложение
    // (#/view-report и др.) работает как раньше.
    // /#/welcome?token=... (share-ссылка, в т.ч. с edit=1) открывается сразу
    // как HTML на /reports/shares/:token/welcome — все кнопки на HTML.
    // Во Flutter уходит только кнопка «Открыть веб-версию» на той странице:
    // маршрут /#/share-edit (здесь не перехватывается).
    window.__viewReport2 = false;
    (function () {
      var hash = window.location.hash || '';
      if (hash.indexOf('#/view-report2') === 0) {
        var q = hash.indexOf('?') >= 0 ? hash.substring(hash.indexOf('?') + 1) : '';
        var params = new URLSearchParams(q);
        var pid = params.get('pid');
        if (pid) {
          // Редирект случился — Flutter грузить не нужно.
          window.__viewReport2 = true;
          var url = '/view/report/' + encodeURIComponent(pid);
          var token = params.get('token');
          if (token) url += '?token=' + encodeURIComponent(token);
          window.location.replace(url);
        }
      } else if (hash.indexOf('#/welcome') === 0) {
        var wq = hash.indexOf('?') >= 0 ? hash.substring(hash.indexOf('?') + 1) : '';
        var wparams = new URLSearchParams(wq);
        var wtoken = wparams.get('token');
        // Любой /#/welcome (в т.ч. с edit=1) — сразу на HTML-welcome с
        // кнопками. Во Flutter уходит только кнопка «Открыть веб-версию»
        // (маршрут /#/share-edit, который здесь не перехватывается).
        if (wtoken) {
          // Редирект случился — Flutter грузить не нужно.
          window.__viewReport2 = true;
          window.location.replace('/reports/shares/' + encodeURIComponent(wtoken) + '/welcome');
        }
      }
    })();
  </script>
  <!-- Splash: виден сразу, до загрузки JS-бандла (важно при медленном канале) -->
  <div id="splash">
    <canvas id="stars"></canvas>
    <div class="splash-logo">easy<span class="logo-accent">Tab</span></div>
    <div class="splash-progress"></div>
  </div>
  <script>
    // Warp-звёзды: рождаются в центре и разлетаются к краям. Глубина z
    // уменьшается с постоянной скоростью → проекция x/z сама даёт
    // ускорение и рост у краёв. Стрик от предыдущей проекции к текущей —
    // вытягивание по направлению движения (ближе = длиннее и толще).
    (function () {
      var c = document.getElementById('stars'), ctx = c.getContext('2d');
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      resize(); addEventListener('resize', resize);
      var N = 150, stars = [];
      function spawn(s, initial) {
        s.x = (Math.random() - 0.5) * c.width;
        s.y = (Math.random() - 0.5) * c.height;
        // Новая звезда — глубоко (проецируется почти в центр). При первой
        // заливке раскидываем по всей глубине, чтобы небо не было пустым.
        s.z = c.width * (initial ? Math.random() * 1.2 : 1.4);
        s.v = 0.7 + Math.random() * 0.6; // личная скорость
        s.b = 0.7 + Math.random() * 0.3; // личная яркость
        s.px = null; // предыдущая проекция — для стрика
      }
      for (var i = 0; i < N; i++) { var s = {}; spawn(s, true); stars.push(s); }
      (function loop() {
        if (!document.body.contains(c)) return; // сплэш удалён — стоп
        ctx.fillStyle = '#f8f7f2';
        ctx.fillRect(0, 0, c.width, c.height);
        var cx = c.width / 2, cy = c.height / 2, max = c.width;
        for (var i = 0; i < N; i++) {
          var s = stars[i];
          var nx = cx + (s.x / s.z) * cx, ny = cy + (s.y / s.z) * cx;
          var t = Math.max(0, 1 - s.z / max); // 0 далеко → 1 близко
          if (s.px !== null) {
            var shade = Math.round((165 - t * 95) * s.b); // серый: ближе — темнее
            ctx.strokeStyle = 'rgba(' + shade + ',' + shade + ',' + shade + ',' + Math.min(1, t * 4) + ')';
            ctx.lineWidth = 0.6 + t * 2.8; // ближе — толще
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(s.px, s.py); // хвост...
            ctx.lineTo(nx, ny);     // ...голова: стрик по вектору полёта
            ctx.stroke();
          }
          s.px = nx; s.py = ny;
          s.z -= (2.5 + t * 7) * s.v; // ближе — быстрее
          // Улетела за экран или «сквозь камеру» — респавн в центре
          if (nx < -60 || nx > c.width + 60 || ny < -60 || ny > c.height + 60 || s.z < 1) spawn(s);
        }
        requestAnimationFrame(loop);
      })();
    })();
  </script>
  <script>
    // Flutter диспатчит flutter-first-frame при первом отрисованном кадре —
    // в этот момент splash больше не нужен.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) el.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Flutter-приложение грузим только в обычном режиме. Для /#/view-report2
       ушли на серверную страницу отчёта (скрипт выше) — бандл не скачиваем. -->
  <script>
    if (!window.__viewReport2) {
      var fbs = document.createElement('script');
      fbs.src = 'flutter_bootstrap.js';
      fbs.async = true;
      document.body.appendChild(fbs);

      // FFmpeg.wasm loader для сжатия видео (ffmpeg.js грузится лениво при
      // первом сжатии). defer: не блокирует парсинг; нужен только приложению.
      // ?v=2 — cache-bust: старая версия лоадера раздавалась с immutable-
      // кэшем на год и застряла в браузерах (ошибка "FFmpegWASM not found").
      var ffm = document.createElement('script');
      ffm.src = 'ffmpeg-loader.js?v=2';
      ffm.defer = true;
      document.body.appendChild(ffm);
    }
  </script>
</body>
</html>
